name: Deploy MMC Community Pass prototype to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mmc-app/package-lock.json
      - name: Install dependencies
        working-directory: mmc-app
        # mmc-app/.npmrc points at Walmart's internal Artifactory registry and
        # routes all traffic through Walmart's internal proxy — required on
        # the Walmart network, but unreachable from GitHub-hosted runners.
        # Every dependency here is a normal public package, so override the
        # registry/proxy for this step only (CLI flags beat the committed
        # .npmrc) rather than editing the file that local/Walmart-network
        # installs still rely on.
        run: >
          npm ci
          --registry=https://registry.npmjs.org/
          --proxy=null
          --https-proxy=null
          --noproxy=*
      - name: Build (base path /mmc-rewards-phase1c/)
        working-directory: mmc-app
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: mmc-app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
